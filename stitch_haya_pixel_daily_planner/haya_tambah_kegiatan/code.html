      b.classList.add('bg-surface-container-low', 'text-on-surface', 'shadow-[2px_2px_0px_#0e1f16]');
    });
    button.classList.remove('bg-surface-container-low', 'text-on-surface', 'shadow-[2px_2px_0px_#0e1f16]');
    button.classList.add('bg-secondary-fixed', 'text-on-secondary-fixed', 'shadow-[3px_3px_0px_#0e1f16]', '-translate-x-[1px]', '-translate-y-[1px]');
  }

  function toggleReminder(btn) {
    const isChecked = btn.getAttribute('aria-pressed') === 'true';
    const textLabel = document.getElementById('reminderText');
    if (isChecked) {
      btn.setAttribute('aria-pressed', 'false');
      btn.classList.remove('bg-primary', 'justify-end');
      btn.classList.add('bg-surface-container-high', 'justify-start');
      textLabel.innerText = 'Tidak Aktif';
      textLabel.classList.add('opacity-50');
    } else {
      btn.setAttribute('aria-pressed', 'true');
      btn.classList.remove('bg-surface-container-high', 'justify-start');
      btn.classList.add('bg-primary', 'justify-end');
      textLabel.innerText = '15 Menit Sebelumnya';
      textLabel.classList.remove('opacity-50');
    }
  }

  function triggerSaveEffect() {
    const btn = document.getElementById('saveBtn');
    const originalText = btn.innerHTML;
    btn.innerHTML = `
      <span class="material-symbols-outlined text-[24px] animate-bounce">check_circle</span>
      <span class="font-headline-sm text-headline-sm uppercase tracking-wider font-bold">MISI TERSIMPAN!</span>
    `;
    btn.classList.remove('bg-primary-container');
    btn.classList.add('bg-primary');
    
    setTimeout(() => {
      btn.innerHTML = originalText;
      btn.classList.remove('bg-primary');
      btn.classList.add('bg-primary-container');
      if (window.history.length > 1) {
        window.history.back();
      }
    }, 1200);
  }
</script></main></body></html>
